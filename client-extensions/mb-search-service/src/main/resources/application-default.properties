#
# OAuth: the /search endpoints are public (guests search too); only /ready and /search are served.
#

liferay.oauth.application.external.reference.codes=mb-search-service-oahs

liferay.oauth.urls.excludes=/ready,/search/*,/search/*/*

#
# Catalog: in-memory copy of approved listings, destinations, active hosts and open slots.
#

mb.search.catalog-refresh-ms=60000
mb.search.slot-days=180

#
# Origins allowed to call the API from a browser (the website).
#

mb.search.cors-origins=http://localhost:8080

#
# Spring Boot
#

server.port=58082
