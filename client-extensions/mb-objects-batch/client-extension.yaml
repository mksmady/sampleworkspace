assemble:
    -   from: batch
        into: batch

# Imports the Maddybaba picklists and object definitions (files in batch/, generated by
# scripts/setup/export-objects-batch.js). Deploy mb-actions-service first: the objects' actions and
# three validation rules call it. No seed data here (CLAUDE.md).

mb-objects-batch:
    name: MB Objects Batch
    oAuthApplicationHeadlessServer: mb-objects-batch-oahs
    type: batch

mb-objects-batch-oahs:
    .serviceAddress: localhost:8080
    .serviceScheme: http
    name: MB Objects Batch OAuth Application Headless Server
    scopes:
        -   Liferay.Headless.Admin.List.Type.everything
        -   Liferay.Headless.Batch.Engine.everything
        -   Liferay.Object.Admin.REST.everything
    type: oAuthApplicationHeadlessServer
