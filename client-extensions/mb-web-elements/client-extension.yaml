assemble:
    -   from: assets/mb-web.css
        hashify: mb-web.css
        into: static
    -   from: assets/mb-web.js
        hashify: mb-web.js
        into: static

# The Maddybaba website's custom elements (phase 10a). One script defines them all and one stylesheet
# styles them, so every element shares the same files: the browser loads them once.
# Search, listing and host data come from mb-search-service's public /search API (docs/search.md 8);
# the app waitlist form posts to /o/c/appwaitlists as the signed-in user or guest.

mb-app-waitlist:
    cssURLs:
        -   mb-web.*.css
    htmlElementName: mb-app-waitlist
    instanceable: false
    name: MB App Waitlist
    portletCategoryName: category.client-extensions
    type: customElement
    urls:
        -   mb-web.*.js
    useESM: false

