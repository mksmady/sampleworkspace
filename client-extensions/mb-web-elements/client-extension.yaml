assemble:
    -   from: assets/mb-web.css
        hashify: mb-web.css
        into: static
    -   from: assets/mb-web.js
        hashify: mb-web.js
        into: static
    -   from: assets/mb-portal.js
        hashify: mb-portal.js
        into: static

# The Maddybaba website's custom elements (docs/website.md). One script defines them all and one
# stylesheet styles them, so every element shares the same files and the browser loads them once.
# Search, listing and host data come from mb-search-service's public /search API (docs/search.md 8);
# destinations and featured reviews from /o/c/destinations and /o/c/reviews (Guest View).

mb-site-header:
    cssURLs:
        -   mb-web.*.css
    htmlElementName: mb-site-header
    instanceable: false
    name: MB Site Header
    portletCategoryName: category.client-extensions
    type: customElement
    urls:
        -   mb-web.*.js
    useESM: false

