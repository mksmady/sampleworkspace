#
# OAuth
#

liferay.oauth.application.external.reference.codes=\
    mb-actions-service-oahs,\
    mb-actions-service-oaua

liferay.oauth.urls.excludes=/ready

#
# Pricing (docs/data-model.md 9.1; seed rates until the business sets the real rules)
#

mb.pricing.platform-fee-percent=5
mb.pricing.gst-on-fee-percent=18

#
# Commissions (phase 7b defaults; the spec leaves both open): the referral host earns this % of the
# subtotal, and commissions become available this many days after the trip ends.
#

mb.commission.available-after-days=7
mb.commission.referral-percent=5

#
# Scheduled jobs (IST). run-on-startup also runs every job once when the service starts (local testing:
# set MB_JOBS_RUN_ON_STARTUP=true).
#

mb.jobs.daily-cron=0 30 1 * * *
mb.jobs.nightly-cron=0 0 2 * * *
mb.jobs.run-on-startup=false

#
# Weather (Open-Meteo, no API key): days fetched, and the limits for "good for activity"
#

mb.weather.forecast-days=7
mb.weather.max-rain-percent=40
mb.weather.max-wind-kmh=30

#
# Spring Boot
#

server.port=58081
