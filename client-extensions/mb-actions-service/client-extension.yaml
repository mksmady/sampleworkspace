assemble:
    -   fromTask: bootJar

# Liferay -> service: object actions and validation rules call the service with a JWT from this app.

mb-actions-service-oaua:
    .serviceAddress: localhost:58081
    .serviceScheme: http
    name: MB Actions Service OAuth Application User Agent
    scopes:
        -   Liferay.Headless.Admin.User.everything.read
    type: oAuthApplicationUserAgent

# Service -> Liferay: every read and write the service makes, as the instance administrator.
# Custom object scopes are c_<object name in lower case>.everything[.read].

mb-actions-service-oahs:
    .serviceAddress: localhost:58081
    .serviceScheme: http
    name: MB Actions Service OAuth Application Headless Server
    scopes:
        -   Liferay.Headless.Admin.User.everything
        -   Liferay.Headless.Admin.Workflow.everything
        -   Liferay.Object.Admin.REST.everything.read
        -   c_availabilityslot.everything
        -   c_booking.everything
        -   c_bookingitem.everything
        -   c_commission.everything
        -   c_destination.everything.read
        -   c_host.everything
        -   c_listing.everything
        -   c_payment.everything.read
        -   c_payout.everything
        -   c_publicholiday.everything.read
        -   c_recommendation.everything
        -   c_review.everything.read
        -   c_traveler.everything.read
        -   c_trippackage.everything.read
        -   c_weathersnapshot.everything
    type: oAuthApplicationHeadlessServer

# Object actions (registered on the objects by scripts/setup/actions.js)

mb-actions-service-availability-slot:
    allowedObjectDefinitionNames:
        -   C_AvailabilitySlot
    name: MB AvailabilitySlot actions
    oAuth2ApplicationExternalReferenceCode: mb-actions-service-oaua
    resourcePath: /object/action/availability-slot
    type: objectAction

